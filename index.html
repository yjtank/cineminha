<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>CINEMINHA | Cinema em casa</title>
  </head>

  <body>
    <header class="site-header">
      <button
        class="icon-button"
        type="button"
        aria-label="Abrir menu"
        id="menu"
      >
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>

      <a class="brand" href="index.html" aria-label="Movieverse, início"
        >CINEMINHA</a
      >

      <button class="icon-button" type="button" aria-label="Abrir perfil">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
      </button>
    </header>

    <aside class="sidebar" id="sidebar">
      <button class="icon-button" id="close-menu" aria-label="Fechar menu">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <nav>
        <a href="#">Início</a>
        <a href="#">Filmes</a>
        <a href="#">Séries</a>
        <a href="#">Minha lista</a>
      </nav>
    </aside>

    <main>
      <section class="featured-film" aria-labelledby="featured-title">
        <div class="featured-film__content">
          <h2 class="featured-film__title" id="featured-title">
            Carregando...
          </h2>

          <div class="featured-film__metadata">
            <span id="featured-year"></span>
            <span id="featured-genre"></span>
            <span id="featured-runtime"></span>

            <span class="featured-film__rating">
              <i class="fa-solid fa-star" aria-hidden="true"></i>
              <span id="featured-rating"></span>
            </span>
          </div>

          <p class="featured-film__description" id="featured-description">
            Carregando informações do filme...
          </p>

          <div class="featured-film__actions">
            <a class="primary-button" href="#catalogo">
              <i class="fa-solid fa-play" aria-hidden="true"></i>
              Assistir agora
            </a>

            <a class="secondary-button" href="#catalogo">Ver detalhes</a>
          </div>
        </div>

        <div class="featured-film__indicators" aria-label="Filmes em destaque"></div>
      </section>

      <section class="film-shelf" id="catalogo" aria-labelledby="popular-title">
        <div class="shelf-header">
          <div>
            <h3 id="popular-title">Em alta</h3>
          </div>

          <a class="shelf-link" href="#catalogo"
            >Ver tudo
            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </a>
        </div>

        <div class="film-row" id="popular-movies"></div>
      </section>
    </main>

    <footer></footer>
    <script src="/js/app.js"></script>
    <script src="/js/api.js"></script>
  </body>
</html>
